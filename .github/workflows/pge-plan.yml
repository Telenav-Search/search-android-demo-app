name: "Claude: Planner"

# Trigger: fires when an issue is labeled with pge/status:ready.
# Delegates to ai-workflows-hub reusable workflow — no AI logic lives here.

on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'pge/status:ready'
    uses: tiankai0114/ai-workflows-hub/.github/workflows/claude-plan.yml@v1
    with:
      aws_role: "arn:aws:iam::759864781520:role/jenkins-actions-bedrock-pge"
      bot_id: "290981734"
      bot_name: "ai-test-kai[bot]"
    secrets:
      figma_token: ${{ secrets.FIGMA_TOKEN }}
